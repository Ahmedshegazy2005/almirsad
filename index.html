const COUNTRIES = [{"code": "EG", "ar": "مصر", "en": "Egypt"}, {"code": "SA", "ar": "السعودية", "en": "Saudi Arabia"}, {"code": "AE", "ar": "الإمارات", "en": "UAE"}, {"code": "US", "ar": "الولايات المتحدة", "en": "United States"}, {"code": "GB", "ar": "بريطانيا", "en": "United Kingdom"}, {"code": "FR", "ar": "فرنسا", "en": "France"}, {"code": "DE", "ar": "ألمانيا", "en": "Germany"}, {"code": "RU", "ar": "روسيا", "en": "Russia"}, {"code": "UA", "ar": "أوكرانيا", "en": "Ukraine"}, {"code": "CN", "ar": "الصين", "en": "China"}, {"code": "JP", "ar": "اليابان", "en": "Japan"}, {"code": "IN", "ar": "الهند", "en": "India"}, {"code": "TR", "ar": "تركيا", "en": "Turkiye"}, {"code": "IR", "ar": "إيران", "en": "Iran"}, {"code": "IL", "ar": "إسرائيل", "en": "Israel"}, {"code": "PS", "ar": "فلسطين", "en": "Palestine"}, {"code": "YE", "ar": "اليمن", "en": "Yemen"}];    /* [{code,ar,en}] */

const UI = {
  ar: {
    title: "المرصد — أخبار العالم", logo: "المرصد",
    searchPlaceholder: "ابحث في كل الأخبار…", all: "الكل",

    priorityNote: (name) => `تم ترتيب الأخبار المتعلقة بـ${name} في الأعلى ضمن كل قسم.`,
    countryDefault: "بدون تفضيل دولة",
    searchResults: (n) => `نتائج البحث (${n})`,
    noResults: "مفيش نتائج مطابقة للبحث.",
    homeFlag: "يخصّك",
    updated: (t) => `آخر تحديث تلقائي: ${t}`,
  },
  en: {
    title: "The Observer — World News", logo: "The Observer",
    searchPlaceholder: "Search all news…", all: "All",
    footer: "The Observer automatically collects headlines and summaries from public RSS sources every day, and links readers to the original source for the full story.",
    priorityNote: (name) => `News related to ${name} has been moved to the top within each section.`,
    countryDefault: "No country preference",
    searchResults: (n) => `Search results (${n})`,
    noResults: "No matching results.",
    homeFlag: "For you",
    updated: (t) => `Last auto-update: ${t}`,
  }
};

const CATEGORIES = [
  { id:"politics",    ar:"سياسة",            en:"Politics",   color:"var(--c-politics)" },
  { id:"military",    ar:"شؤون عسكرية",      en:"Military",   color:"var(--c-military)" },
  { id:"cooperation", ar:"تعاونات واتفاقيات", en:"Agreements", color:"var(--c-cooperation)" },
  { id:"ai",          ar:"ذكاء اصطناعي",     en:"AI",         color:"var(--c-ai)" },
  { id:"business",    ar:"بورصة واقتصاد",    en:"Business",   color:"var(--c-business)" },
  { id:"sports",      ar:"رياضة",            en:"Sports",     color:"var(--c-sports)" },
  { id:"world",       ar:"العالم",           en:"World",      color:"var(--c-world)" },
];

const state = { active:"all", lang:"ar", country:"", query:"" };
try {
  const savedLang = localStorage.getItem("almirsad_lang");
  const savedCountry = localStorage.getItem("almirsad_country");
  if (savedLang) state.lang = savedLang;
  if (savedCountry) state.country = savedCountry;
} catch(e){}

function t(key, ...args){ const v = UI[state.lang][key]; return typeof v === "function" ? v(...args) : v; }
function catLabel(cat){ return state.lang === "ar" ? cat.ar : cat.en; }
function countryName(code){ const c = COUNTRIES.find(x=>x.code===code); return c ? (state.lang==="ar"?c.ar:c.en) : code; }

function applyLang(){
  const root = document.getElementById("htmlRoot");
  root.setAttribute("lang", state.lang);
  root.setAttribute("dir", state.lang === "ar" ? "rtl" : "ltr");
  document.title = t("title");
  document.getElementById("logoText").textContent = t("logo");
  document.getElementById("snapBadge").textContent = t("updated", UPDATED_AT);
  document.getElementById("searchInput").placeholder = t("searchPlaceholder");
  document.getElementById("footerText").textContent = t("footer");
  document.getElementById("langSelect").value = state.lang;
  buildCountrySelect();
  buildNav();
  render();
}

function buildCountrySelect(){
  const sel = document.getElementById("countrySelect");
  sel.innerHTML = "";
  const optDefault = document.createElement("option");
  optDefault.value = ""; optDefault.textContent = t("countryDefault");
  sel.appendChild(optDefault);
  COUNTRIES.forEach(c => {
    const o = document.createElement("option");
    o.value = c.code; o.textContent = state.lang === "ar" ? c.ar : c.en;
    sel.appendChild(o);
  });
  sel.value = state.country;
}

function buildNav(){
  const nav = document.getElementById("catNav");
  nav.innerHTML = "";
  const wrapDiv = document.createElement("div");
  wrapDiv.className = "wrap"; wrapDiv.style.display = "flex";
  const btnAll = document.createElement("button");
  btnAll.className = "cat-btn"; btnAll.textContent = t("all"); btnAll.dataset.id = "all";
  wrapDiv.appendChild(btnAll);
  CATEGORIES.forEach(c => {
    const b = document.createElement("button");
    b.className = "cat-btn"; b.dataset.id = c.id;
    b.style.setProperty("--dot", c.color);
    b.innerHTML = catLabel(c) + '<span class="dot"></span>';
    wrapDiv.appendChild(b);
  });
  nav.appendChild(wrapDiv);
  nav.querySelectorAll(".cat-btn").forEach(b => {
    b.addEventListener("click", () => { state.active = b.dataset.id; updateNavSelection(); render(); });
  });
  updateNavSelection();
}
function updateNavSelection(){
  document.querySelectorAll(".cat-btn").forEach(b => b.setAttribute("aria-selected", String(b.dataset.id === state.active)));
}

function sortByCountry(items){
  if (!state.country) return items;
  const withFlag = items.map((it,i) => ({ it, i, match: (it.countries||[]).includes(state.country) }));
  withFlag.sort((a,b) => (b.match - a.match) || (a.i - b.i));
  return withFlag.map(x => x.it);
}
function matchesQuery(it, q){
  return (it.title||"").toLowerCase().includes(q) || (it.desc||"").toLowerCase().includes(q);
}
function renderStory(it, cat){
  const a = document.createElement("a");
  a.href = it.link; a.target = "_blank"; a.rel = "noopener noreferrer";
  a.className = "story"; a.style.setProperty("--dot", cat.color);
  const flagged = state.country && (it.countries||[]).includes(state.country);
  a.innerHTML = `
    <div class="story-title">${it.title} ${flagged ? `<span class="home-flag">${t("homeFlag")}</span>` : ""}</div>
    <div class="story-desc">${it.desc}</div>
    <div class="story-foot"><span class="src">${it.source}</span></div>`;
  return a;
}

function render(){
  const content = document.getElementById("content");
  const status = document.getElementById("status");
  content.innerHTML = ""; status.innerHTML = "";
  const pool = ARTICLES[state.lang] || {};
  const q = state.query.trim().toLowerCase();

  if (q){
    let results = [];
    CATEGORIES.forEach(cat => (pool[cat.id]||[]).forEach(it => { if (matchesQuery(it,q)) results.push({it,cat}); }));
    status.textContent = t("searchResults", results.length);
    if (results.length === 0){ content.innerHTML = `<div class="empty">${t("noResults")}</div>`; return; }
    const river = document.createElement("div"); river.className = "river";
    results.forEach(({it,cat}) => river.appendChild(renderStory(it, cat)));
    content.appendChild(river);
    return;
  }

  if (state.country){
    const note = document.createElement("div");
    note.className = "priority-note";
    note.textContent = t("priorityNote", countryName(state.country));
    content.appendChild(note);
  }

  const catsToShow = state.active === "all" ? CATEGORIES : CATEGORIES.filter(c => c.id === state.active);
  let any = false;
  catsToShow.forEach(cat => {
    let items = pool[cat.id] || [];
    if (items.length === 0) return;
    any = true;
    items = sortByCountry(items);
    const title = document.createElement("div");
    title.className = "section-title"; title.style.setProperty("--dot", cat.color);
    title.innerHTML = `<span class="dot"></span> ${catLabel(cat)}`;
    content.appendChild(title);
    const river = document.createElement("div"); river.className = "river";
    items.forEach(it => river.appendChild(renderStory(it, cat)));
    content.appendChild(river);
  });
  if (!any) content.innerHTML = `<div class="empty">${t("noResults")}</div>`;
}

document.getElementById("langSelect").addEventListener("change", (e) => {
  state.lang = e.target.value;
  try{ localStorage.setItem("almirsad_lang", state.lang); }catch(err){}
  applyLang();
});
document.getElementById("countrySelect").addEventListener("change", (e) => {
  state.country = e.target.value;
  try{ localStorage.setItem("almirsad_country", state.country); }catch(err){}
  render();
});
document.getElementById("searchInput").addEventListener("input", (e) => { state.query = e.target.value; render(); });
document.getElementById("themeToggle").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem("almirsad_theme", next); }catch(e){}
});
try {
  const savedTheme = localStorage.getItem("almirsad_theme");
  if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
} catch(e){}

applyLang();
</script>
</body>
</html>
