name: Update news daily

on:
  schedule:
    # يشتغل كل يوم الساعة 6 صباحًا بتوقيت غرينتش (يعني حوالي 8 أو 9 صباحًا بتوقيت مصر)
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # زرار تشغيل يدوي من تبويب Actions

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser

      - name: Fetch news and rebuild site
        run: python fetch_news.py

      - name: Commit and push if changed
        run: |
          git config user.name "almirsad-bot"
          git config user.email "actions@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-update news $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
